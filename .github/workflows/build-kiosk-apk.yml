# Build & Publish Kiosk APK — TTStaffPro monorepo (root repo)
#
# MANUAL ONLY: triggered from the GitHub Actions tab
# (Actions → "Build & Publish Kiosk APK" → Run workflow). It does NOT auto-run
# on push. Default mode = DEBUG (development). Pick `release` to build the
# production APK and publish it to a GitHub Release.
#
# Runs from the ROOT repo because the kiosk app (`apps/ttstaffpro_face_attendance`)
# depends on the private `open_core_hr` package via `path: ../..`. Building here
# means NO cross-repo GitHub token is required (the default GITHUB_TOKEN has full
# access to this repo).
#
# Manual usage:
#   - build_type = `debug`   → builds DEBUG apk → updates the rolling
#     "Kiosk Development Build (debug)" prerelease.
#   - build_type = `release` → builds RELEASE apk → publishes to the GitHub
#     Release named by `release_tag` (default `kiosk-release`).

name: Build & Publish Kiosk APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug = development, release = production)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      release_tag:
        description: 'GitHub Release tag (used when build_type = release)'
        required: false
        default: 'kiosk-release'

env:
  FLUTTER_VERSION: '3.44.9'
  APP_DIR: apps/ttstaffpro_face_attendance

concurrency:
  group: kiosk-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kiosk-apk:
    name: Build & publish kiosk APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies (kiosk)
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Determine build type
        id: plan
        shell: bash
        run: |
          type="${{ inputs.build_type }}"
          if [ -z "$type" ]; then type="debug"; fi
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "::notice::Building $type kiosk APK (manual dispatch)"

      - name: Build DEBUG APK (development)
        if: steps.plan.outputs.type == 'debug'
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug

      - name: Build RELEASE APK (production)
        if: steps.plan.outputs.type == 'release'
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: Stage APK with versioned name
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ env.APP_DIR }}"
          VER="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/[[:space:]]//g')"
          if [ "${{ steps.plan.outputs.type }}" = "release" ]; then
            SRC=build/app/outputs/flutter-apk/app-release.apk
            DST="TTStaffPro-Kiosk-v${VER}-release.apk"
          else
            SRC=build/app/outputs/flutter-apk/app-debug.apk
            DST="TTStaffPro-Kiosk-v${VER}-debug-${GITHUB_SHA:0:8}.apk"
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$SRC" "$GITHUB_WORKSPACE/dist/$DST"
          echo "artifact=$DST" >> "$GITHUB_OUTPUT"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Publish DEV build → rolling GitHub Release
        if: steps.plan.outputs.type == 'debug'
        uses: ncipollo/release-action@v1
        with:
          tag: kiosk-dev-latest
          name: Kiosk Development Build (debug)
          body: |
            Auto-generated **debug APK** from the latest `main` push.

            - Commit: `${{ github.sha }}`
            - Artifact: `${{ steps.stage.outputs.artifact }}`
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: ${{ github.workspace }}/dist/${{ steps.stage.outputs.artifact }}

      - name: Publish RELEASE build → GitHub Release (tag)
        if: steps.plan.outputs.type == 'release'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.release_tag }}
          name: TTStaffPro Kiosk ${{ inputs.release_tag }}
          body: |
            Production **release APK** (manual build).

            - Artifact: `${{ steps.stage.outputs.artifact }}`
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: ${{ github.workspace }}/dist/${{ steps.stage.outputs.artifact }}
