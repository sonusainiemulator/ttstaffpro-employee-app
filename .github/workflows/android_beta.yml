name: Android Beta CI/CD

on:
  push:
    branches:
      - main
      - beta
      - develop

jobs:
  build:
    name: Build and Deploy Beta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-key.jks
          EOF

      - name: Set Version
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          VERSION_CODE=$GITHUB_RUN_NUMBER
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "TAG=beta-v${VERSION_NAME}-${VERSION_CODE}" >> $GITHUB_OUTPUT
          sed -i "s/^version:.*/version: ${VERSION_NAME}+${VERSION_CODE}/" pubspec.yaml
          echo "Building version: ${VERSION_NAME}+${VERSION_CODE}"

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Rename output files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/TTStaffPro-beta-v${{ steps.version.outputs.VERSION_NAME }}.apk
          cp build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/TTStaffPro-beta-v${{ steps.version.outputs.VERSION_NAME }}.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTStaffPro-beta-APK
          path: build/app/outputs/flutter-apk/TTStaffPro-beta-v${{ steps.version.outputs.VERSION_NAME }}.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTStaffPro-beta-AAB
          path: build/app/outputs/bundle/release/TTStaffPro-beta-v${{ steps.version.outputs.VERSION_NAME }}.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.TAG }}
          name: Beta v${{ steps.version.outputs.VERSION_NAME }} (Build ${{ steps.version.outputs.VERSION_CODE }})
          body: |
            ## TTStaffPro Beta Release

            **Version:** ${{ steps.version.outputs.VERSION_NAME }}+${{ steps.version.outputs.VERSION_CODE }}
            **Branch:** ${{ github.ref_name }}
            **Built by:** ${{ github.actor }}

            ### Downloads
            - **TTStaffPro-beta-APK** → Install directly on Android device
            - **TTStaffPro-beta-AAB** → Upload to Google Play Store

            > To install APK: enable "Install from unknown sources" in Android Settings
          artifacts: |
            build/app/outputs/flutter-apk/TTStaffPro-beta-v${{ steps.version.outputs.VERSION_NAME }}.apk
            build/app/outputs/bundle/release/TTStaffPro-beta-v${{ steps.version.outputs.VERSION_NAME }}.aab
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Google Play Open Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonKeyData: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ttstaffpro.hrapp
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: beta
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: >
            {
              "text": "✅ TTStaffPro Beta v${{ steps.version.outputs.VERSION_NAME }} deployed to Play Store!",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "✅ Beta Build Successful", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Version:*\n`${{ steps.version.outputs.VERSION_NAME }}+${{ steps.version.outputs.VERSION_CODE }}`" },
                    { "type": "mrkdwn", "text": "*Track:*\nOpen Testing (Beta)" },
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*By:*\n${{ github.actor }}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "⬇️ Download APK" }, "url": "https://github.com/${{ github.repository }}/releases/latest" },
                    { "type": "button", "text": { "type": "plain_text", "text": "🔍 View Run" }, "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: >
            {
              "text": "❌ TTStaffPro Beta build FAILED on `${{ github.ref_name }}`",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "❌ Beta Build Failed", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*By:*\n${{ github.actor }}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "🔍 View Logs" }, "style": "danger", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
